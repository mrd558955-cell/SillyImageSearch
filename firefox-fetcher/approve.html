<body>
<h2>Allow <span class="site" id="site"></span>?</h2>
<p>The Image Search extension in SillyTavern wants to search <span class="site" id="site2"></span> through Firefox: with this browser, as if you browsed the site yourself, only when you search, one request at a time.</p>
<button id="allow">Allow</button><button id="deny">No</button>
